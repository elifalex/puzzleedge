<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <!--
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover"
    />
    <!--
      Disable tap highlight on IE.
      https://stackoverflow.com/a/29961714/4047926
     -->
    <meta name="msapplication-tap-highlight" content="no" />

    <!--
      This is generated from the expo-router configuration.
     -->
    %WEB_TITLE%

    <!--
      This is generated from the expo-router configuration.
     -->
    %WEB_META_TAGS%

    <!--
      The root style tag ensures the root element fills the screen.
     -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Google AdSense Verification & Setup -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6082551497006632"
         crossorigin="anonymous"></script>

    <!--
      The root element for your Expo app.
     -->
    <div id="root"></div>
  </body>
</html>
